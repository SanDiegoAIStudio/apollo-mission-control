[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "apollo-mission-control"
version = "0.1.0"
description = "Multi-agent AI simulation of NASA's Apollo Mission Control for KSP"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
authors = [
    { name = "lcb-projects" },
]
keywords = ["ai", "agents", "ksp", "apollo", "mission-control", "llm"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Education",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Astronomy",
    "Topic :: Games/Entertainment :: Simulation",
]
dependencies = [
    "anthropic>=0.40.0",
    "pydantic>=2.0",
    "asyncio-telnet>=0.1.0",
    "rich>=13.0",
    "structlog>=24.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.24",
    "ruff>=0.8",
    "mypy>=1.13",
]
openai = [
    "openai>=1.50",
]
dashboard = [
    "fastapi>=0.115",
    "uvicorn>=0.32",
    "websockets>=13.0",
]

[project.urls]
Repository = "https://github.com/lcb-projects/apollo-mission-control"
Issues = "https://github.com/lcb-projects/apollo-mission-control/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/apollo_mc"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM", "TCH"]

[tool.mypy]
python_version = "3.11"
strict = true

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
